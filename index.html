<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Orçamento Quinzenal</title>
  <meta name="description" content="Controle de orçamento para quem recebe o salário em duas vezes no mês.">
  <meta name="theme-color" content="#5b2db5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Orçamento">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icones/icone-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icones/icone-180.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topo">
    <span class="topo__marca" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18"/><path d="M15 15h2"/></svg>
    </span>
    <h1>Orçamento Quinzenal</h1>
    <button id="botao-menu" class="botao-icone botao-menu" type="button"
            aria-label="Abrir menu" aria-haspopup="dialog" aria-controls="menu-lateral" aria-expanded="false">
      <svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
  </header>

  <main class="conteudo">
    <section id="tela-mes" data-tela-conteudo="mes" aria-label="Lançamentos do mês">
      <div id="seletor-mes" class="cartao seletor-mes"></div>
      <div class="cabecalho-mes">
        <h2 id="titulo-mes" class="cabecalho-mes__titulo"></h2>
        <button id="botao-copiar-mes" class="botao-icone botao-copiar" type="button"
                aria-label="Copiar este mês para os meses seguintes" title="Copiar este mês para os meses seguintes">
          <svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="8" y="8" width="13" height="13" rx="2.5"/><path d="M4 16V6a3 3 0 0 1 3-3h9"/><path d="M12 14.5h5"/><path d="m14.8 12 2.5 2.5-2.5 2.5"/></svg>
        </button>
      </div>
      <div id="quinzenas"></div>
    </section>
    <section id="tela-contas" data-tela-conteudo="contas" aria-label="Contas a pagar" hidden>
      <button class="botao-voltar" type="button" data-tela="mes"><svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m15 18-6-6 6-6"/></svg><span>Voltar para o mês</span></button>
      <div id="painel-contas"></div>
    </section>
    <section id="tela-comparacao" data-tela-conteudo="comparacao" aria-label="Este mês comparado com o anterior" hidden>
      <button class="botao-voltar" type="button" data-tela="mes"><svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m15 18-6-6 6-6"/></svg><span>Voltar para o mês</span></button>
      <div id="painel-comparacao"></div>
    </section>
    <section id="tela-anual" data-tela-conteudo="anual" aria-label="Resumo do ano" hidden>
      <button class="botao-voltar" type="button" data-tela="mes"><svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m15 18-6-6 6-6"/></svg><span>Voltar para o mês</span></button>
      <div id="painel-anual"></div>
    </section>
  </main>

  <dialog id="menu-lateral" class="menu-lateral" aria-label="Menu">
    <div class="menu-lateral__painel">
      <div class="menu-lateral__topo">
        <strong>Menu</strong>
        <button type="button" class="botao-icone" data-acao="fechar-menu" aria-label="Fechar menu"><svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      </div>
      <ul class="menu-lateral__lista">
        <li>
          <button type="button" class="menu-lateral__opcao" data-tela="mes">
            <svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
            <span><strong>Lançamentos do mês</strong><small>Recebimentos e gastos de cada quinzena</small></span>
          </button>
        </li>
      </ul>
      <p class="menu-lateral__secao">Relatórios</p>
      <ul class="menu-lateral__lista">
        <li>
          <button type="button" class="menu-lateral__opcao" data-tela="contas">
            <svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="m9 11 2 2 4-4"/></svg>
            <span><strong>Contas a pagar</strong><small>O que já foi pago e o que falta pagar</small></span>
          </button>
        </li>
        <li>
          <button type="button" class="menu-lateral__opcao" data-tela="comparacao">
            <svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M7 4v16"/><path d="m3 8 4-4 4 4"/><path d="M17 20V4"/><path d="m21 16-4 4-4-4"/></svg>
            <span><strong>Este mês × anterior</strong><small>O que subiu e o que baixou</small></span>
          </button>
        </li>
        <li>
          <button type="button" class="menu-lateral__opcao" data-tela="anual">
            <svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 20h16"/><path d="M7 16v-5M12 16V6M17 16v-8"/></svg>
            <span><strong>Resumo do ano</strong><small>Totais e gastos de todo o ano</small></span>
          </button>
        </li>
      </ul>
    </div>
  </dialog>

  <dialog id="dialogo-lancamento" class="dialogo">
    <form>
      <h2 data-campo="titulo">Novo lançamento</h2>
      <label>Descrição
        <input name="descricao" required maxlength="60" autocomplete="off" enterkeyhint="next">
      </label>
      <label>Valor (R$)
        <input name="valor" inputmode="decimal" placeholder="0,00" autocomplete="off" enterkeyhint="next">
      </label>
      <label>Dia
        <input name="dia" type="number" inputmode="numeric" required>
      </label>
      <p class="dialogo__erro" data-campo="erro" role="alert"></p>
      <div class="dialogo__acoes">
        <button type="submit" value="cancelar" formnovalidate class="botao-secundario">Cancelar</button>
        <button type="submit" value="salvar" class="botao-primario">Salvar</button>
      </div>
    </form>
  </dialog>

  <dialog id="dialogo-copia" class="dialogo">
    <form>
      <h2 data-campo="titulo">Copiar mês</h2>
      <p class="dialogo__aviso">
        Marque os meses que vão receber uma cópia de todos os lançamentos deste mês.
        Os lançamentos que já existem nesses meses serão <strong>substituídos</strong>.
      </p>
      <div class="lista-opcoes-mes" data-campo="meses"></div>
      <p class="dialogo__erro" data-campo="erro" role="alert"></p>
      <div class="dialogo__acoes">
        <button type="submit" value="cancelar" formnovalidate class="botao-secundario">Cancelar</button>
        <button type="submit" value="copiar" class="botao-primario">Copiar</button>
      </div>
    </form>
  </dialog>

  <div id="aviso" class="aviso" role="status" aria-live="polite" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
