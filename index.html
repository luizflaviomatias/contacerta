<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ContaCerta</title>
  <meta name="description" content="Controle de orçamento simples, por mês ou por quinzena.">
  <meta name="theme-color" content="#5b2db5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ContaCerta">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icones/icone-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icones/icone-180.png">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Aplica o tema escolhido antes da primeira pintura, para a tela não piscar clara antes de ficar escura.
    try {
      const preferencias = JSON.parse(localStorage.getItem('contacerta:preferencias'));
      if (preferencias?.tema === 'escuro') document.documentElement.dataset.tema = 'escuro';
    } catch { /* sem preferências salvas: fica o tema claro */ }
  </script>
</head>
<body>
  <header class="topo">
    <span class="topo__marca" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18"/><path d="M15 15h2"/></svg>
    </span>
    <h1>ContaCerta</h1>
    <div id="seletor-de-idioma" class="seletor-de-idioma"></div>
    <button id="botao-menu" class="botao-icone botao-menu" type="button"
            aria-label="Abrir menu" data-i18n-aria="menu.abrir" aria-haspopup="dialog" aria-controls="menu-lateral" aria-expanded="false">
      <svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
  </header>

  <main class="conteudo">
    <section id="tela-mes" data-tela-conteudo="mes" aria-label="Lançamentos do mês" data-i18n-aria="menu.lancamentos">
      <div id="seletor-mes" class="cartao seletor-mes"></div>
      <div class="cabecalho-mes">
        <h2 id="titulo-mes" class="cabecalho-mes__titulo"></h2>
        <button id="botao-copiar-mes" class="botao-icone botao-copiar" type="button"
                aria-label="Copiar este mês para os meses seguintes" title="Copiar este mês para os meses seguintes"
                data-i18n-aria="mes.copiar" data-i18n-title="mes.copiar">
          <svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="8" y="8" width="13" height="13" rx="2.5"/><path d="M4 16V6a3 3 0 0 1 3-3h9"/><path d="M12 14.5h5"/><path d="m14.8 12 2.5 2.5-2.5 2.5"/></svg>
        </button>
      </div>
      <div id="grade-do-mes"></div>
    </section>
    <section id="tela-contas" data-tela-conteudo="contas" aria-label="Contas a pagar" data-i18n-aria="menu.contas" hidden>
      <button class="botao-voltar" type="button" data-tela="mes"><svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m15 18-6-6 6-6"/></svg><span data-i18n="voltar.mes">Voltar para o mês</span></button>
      <div id="painel-contas"></div>
    </section>
    <section id="tela-comparacao" data-tela-conteudo="comparacao" aria-label="Este mês comparado com o anterior" data-i18n-aria="menu.comparacao" hidden>
      <button class="botao-voltar" type="button" data-tela="mes"><svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m15 18-6-6 6-6"/></svg><span data-i18n="voltar.mes">Voltar para o mês</span></button>
      <div id="painel-comparacao"></div>
    </section>
    <section id="tela-anual" data-tela-conteudo="anual" aria-label="Resumo do ano" data-i18n-aria="menu.anual" hidden>
      <button class="botao-voltar" type="button" data-tela="mes"><svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m15 18-6-6 6-6"/></svg><span data-i18n="voltar.mes">Voltar para o mês</span></button>
      <div id="painel-anual"></div>
    </section>
  </main>

  <dialog id="menu-lateral" class="menu-lateral" aria-label="Menu" data-i18n-aria="menu.titulo">
    <div class="menu-lateral__painel">
      <div class="menu-lateral__topo">
        <strong data-i18n="menu.titulo">Menu</strong>
        <button type="button" class="botao-icone" data-acao="fechar-menu" aria-label="Fechar menu" data-i18n-aria="menu.fechar"><svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      </div>
      <ul class="menu-lateral__lista">
        <li>
          <button type="button" class="menu-lateral__opcao" data-tela="mes">
            <svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
            <span><strong data-i18n="menu.lancamentos">Lançamentos do mês</strong><small id="descricao-lancamentos" data-i18n="menu.lancamentos.quinzenal">Recebimentos e gastos de cada quinzena</small></span>
          </button>
        </li>
      </ul>
      <p class="menu-lateral__secao" data-i18n="menu.relatorios">Relatórios</p>
      <ul class="menu-lateral__lista">
        <li>
          <button type="button" class="menu-lateral__opcao" data-tela="contas">
            <svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="m9 11 2 2 4-4"/></svg>
            <span><strong data-i18n="menu.contas">Contas a pagar</strong><small data-i18n="menu.contas.descricao">O que já foi pago e o que falta pagar</small></span>
          </button>
        </li>
        <li>
          <button type="button" class="menu-lateral__opcao" data-tela="comparacao">
            <svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M7 4v16"/><path d="m3 8 4-4 4 4"/><path d="M17 20V4"/><path d="m21 16-4 4-4-4"/></svg>
            <span><strong data-i18n="menu.comparacao">Este mês × anterior</strong><small data-i18n="menu.comparacao.descricao">O que subiu e o que baixou</small></span>
          </button>
        </li>
        <li>
          <button type="button" class="menu-lateral__opcao" data-tela="anual">
            <svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 20h16"/><path d="M7 16v-5M12 16V6M17 16v-8"/></svg>
            <span><strong data-i18n="menu.anual">Resumo do ano</strong><small data-i18n="menu.anual.descricao">Totais e gastos de todo o ano</small></span>
          </button>
        </li>
      </ul>
      <p class="menu-lateral__secao" data-i18n="menu.preferencias">Preferências</p>
      <div class="preferencia" role="group" aria-labelledby="rotulo-tema">
        <span class="preferencia__rotulo" id="rotulo-tema" data-i18n="preferencias.tema">Tema</span>
        <div class="escolhas">
          <button type="button" data-preferencia="tema" data-valor="claro" aria-pressed="false"><svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span data-i18n="preferencias.tema.claro">Claro</span></button>
          <button type="button" data-preferencia="tema" data-valor="escuro" aria-pressed="false"><svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg><span data-i18n="preferencias.tema.escuro">Escuro</span></button>
        </div>
      </div>
      <div class="preferencia" role="group" aria-labelledby="rotulo-moeda">
        <span class="preferencia__rotulo" id="rotulo-moeda" data-i18n="preferencias.moeda">Moeda</span>
        <div class="escolhas escolhas--moeda">
          <button type="button" data-preferencia="moeda" data-valor="BRL" aria-pressed="false"><strong>R$</strong><small data-i18n="moeda.BRL">Real</small></button>
          <button type="button" data-preferencia="moeda" data-valor="EUR" aria-pressed="false"><strong>€</strong><small data-i18n="moeda.EUR">Euro</small></button>
          <button type="button" data-preferencia="moeda" data-valor="USD" aria-pressed="false"><strong>US$</strong><small data-i18n="moeda.USD">Dólar</small></button>
        </div>
      </div>
    </div>
  </dialog>

  <dialog id="dialogo-lancamento" class="dialogo">
    <form>
      <h2 data-campo="titulo">Novo lançamento</h2>
      <label><span data-i18n="dialogo.descricao">Descrição</span>
        <input name="descricao" required maxlength="60" autocomplete="off" enterkeyhint="next">
      </label>
      <label><span data-campo="rotulo-valor">Valor</span>
        <input name="valor" inputmode="decimal" autocomplete="off" enterkeyhint="next">
      </label>
      <label><span data-i18n="dialogo.dia">Dia</span>
        <input name="dia" type="number" inputmode="numeric" required>
      </label>
      <p class="dialogo__erro" data-campo="erro" role="alert"></p>
      <div class="dialogo__acoes">
        <button type="submit" value="cancelar" formnovalidate class="botao-secundario" data-i18n="dialogo.cancelar">Cancelar</button>
        <button type="submit" value="salvar" class="botao-primario" data-i18n="dialogo.salvar">Salvar</button>
      </div>
    </form>
  </dialog>

  <dialog id="dialogo-copia" class="dialogo">
    <form>
      <h2 data-campo="titulo">Copiar mês</h2>
      <p class="dialogo__aviso" data-i18n-html="copia.aviso"></p>
      <div class="lista-opcoes-mes" data-campo="meses"></div>
      <p class="dialogo__erro" data-campo="erro" role="alert"></p>
      <div class="dialogo__acoes">
        <button type="submit" value="cancelar" formnovalidate class="botao-secundario" data-i18n="dialogo.cancelar">Cancelar</button>
        <button type="submit" value="copiar" class="botao-primario" data-i18n="copia.copiar">Copiar</button>
      </div>
    </form>
  </dialog>

  <div id="aviso" class="aviso" role="status" aria-live="polite" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
